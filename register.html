<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Kayıt Ol</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#EAB308;--gold-light:#FDE047;--bg:#09090B;--bg-card:#111114;--bg-input:#1C1C21;--border:#27272A;--text:#FAFAFA;--text-muted:#A1A1AA;--text-dim:#71717A;--red:#EF4444;--green:#22C55E;--font-sans:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background-image:radial-gradient(circle at 50% 0%,rgba(234,179,8,0.08),transparent 60%)}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:2.5rem 2rem;box-shadow:0 20px 60px -20px rgba(0,0,0,0.8)}
.logo{display:flex;justify-content:center;gap:0.5rem;font-size:1.25rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.5rem}
.logo span{color:var(--gold)}
.subtitle{text-align:center;color:var(--text-dim);font-size:0.8125rem;font-family:var(--font-mono);margin-bottom:2rem}
.field{display:flex;flex-direction:column;gap:0.375rem;margin-bottom:1rem}
.field label{font-size:0.75rem;font-weight:600;color:var(--text-muted)}
.field input{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:0.75rem 1rem;color:var(--text);font-size:0.875rem;font-family:var(--font-mono);outline:none;transition:border-color 0.15s}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:var(--text-dim)}
.btn{width:100%;padding:0.875rem;border:none;border-radius:var(--radius);font-size:0.875rem;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--bg);transition:all 0.15s;margin-top:0.5rem}
.btn:hover{box-shadow:0 0 24px -8px rgba(234,179,8,0.6);transform:translateY(-1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{padding:0.625rem 0.875rem;border-radius:var(--radius);font-size:0.75rem;font-family:var(--font-mono);margin-bottom:1rem;display:none}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);display:block}
.msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--green);display:block}
.footer{text-align:center;margin-top:1.5rem;font-size:0.75rem;color:var(--text-dim);font-family:var(--font-mono)}
.footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="card">
    <div class="logo">𝐍𝐄𝐗𝐔𝐒 <span>𝐊𝐀𝐘𝐈𝐓</span></div>
    <div class="subtitle">// yeni hesap oluştur</div>
    <div class="msg" id="msg"></div>
    <form id="regForm">
        <div class="field"><label>Kullanıcı Adı</label><input type="text" id="username" placeholder="kullanici_adi" required minlength="3"></div>
        <div class="field"><label>E-posta (Opsiyonel)</label><input type="email" id="email" placeholder="ornek@mail.com"></div>
        <div class="field"><label>Şifre</label><input type="password" id="password" placeholder="••••••••" required minlength="6"></div>
        <div class="field"><label>Şifre Tekrar</label><input type="password" id="password2" placeholder="••••••••" required></div>
        <button type="submit" class="btn" id="submitBtn">KAYIT OL</button>
    </form>
    <div class="footer">Zaten hesabın var mı? <a href="login.html">Giriş yap</a></div>
</div>

<script>
const API_URL = 'https://nexuspanel-t583.onrender.com/api';

function showMsg(text, type){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(() => el.className = 'msg', 5000);
}

document.getElementById('regForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if(password !== password2){ showMsg('Şifreler eşleşmiyor', 'error'); return; }
    if(password.length < 6){ showMsg('Şifre en az 6 karakter olmalı', 'error'); return; }

    btn.disabled = true; btn.textContent = 'KAYIT OLUYOR...';
    try {
        const res = await fetch(`${API_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if(!res.ok){ showMsg(data.error || 'Kayıt başarısız', 'error'); btn.disabled = false; btn.textContent = 'KAYIT OL'; return; }
        showMsg('Kayıt başarılı! Giriş sayfasına yönlendiriliyor...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
        showMsg('Sunucuya bağlanılamadı. Backend çalışıyor mu?', 'error');
        btn.disabled = false; btn.textContent = 'KAYIT OL';
    }
});
</script>
</body>
</html>
