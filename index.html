<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝐍𝐄𝐗𝐔𝐒 𝐒𝐎𝐑𝐆𝐔 𝐕𝐈𝐏</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#EAB308;--gold-light:#FDE047;--gold-dark:#A16207;--gold-dim:rgba(234,179,8,0.08);--gold-border:rgba(234,179,8,0.2);--bg:#09090B;--bg-card:#111114;--bg-elevated:#18181C;--bg-code:#0C0C0F;--bg-input:#1C1C21;--border:#27272A;--border-hover:#3F3F46;--text:#FAFAFA;--text-muted:#A1A1AA;--text-dim:#71717A;--green:#22C55E;--red:#EF4444;--blue:#3B82F6;--purple:#A855F7;--orange:#F97316;--font-sans:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;--radius-sm:6px;--radius-md:10px;--radius-lg:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.container{max-width:1320px;margin:0 auto;padding:0 2rem;width:100%}
.navbar{position:sticky;top:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0.75rem 0}
.navbar .container{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.nav-left{display:flex;align-items:center;gap:0.75rem}
.hamburger{width:38px;height:38px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:all 0.15s;flex-shrink:0}
.hamburger:hover{border-color:var(--gold);background:var(--gold-dim)}
.hamburger span{display:block;width:16px;height:2px;background:var(--text-muted);border-radius:2px;transition:all 0.2s}
.hamburger:hover span{background:var(--gold)}
.logo{font-size:1.125rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);text-decoration:none;white-space:nowrap}
.logo span{color:var(--gold)}
.nav-actions{display:flex;gap:0.5rem;align-items:center}
.avatar-btn{padding:0.25rem 0.75rem 0.25rem 0.25rem;display:flex;align-items:center;gap:0.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:all 0.15s;color:var(--text);text-decoration:none}
.avatar-btn:hover{border-color:var(--gold)}
.avatar-mini{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-border);flex-shrink:0;background:var(--bg-elevated)}
.avatar-name{font-size:0.75rem;font-weight:600;font-family:var(--font-mono);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;background:var(--bg-card);border-right:1px solid var(--border);z-index:201;transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:1.25rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.drawer-title{font-size:0.875rem;font-weight:800;letter-spacing:-0.02em}
.drawer-title span{color:var(--gold)}
.drawer-close{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:1.25rem;line-height:1;padding:0.25rem}
.drawer-close:hover{color:var(--red)}
.drawer-search{padding:0.75rem 1rem;flex-shrink:0;position:relative}
.drawer-search input{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.5rem 0.75rem;color:var(--text);font-size:0.8125rem;font-family:var(--font-mono);outline:none}
.drawer-search input:focus{border-color:var(--gold)}
.drawer-search input::placeholder{color:var(--text-dim)}
.drawer-body{flex:1;overflow-y:auto;padding:0.5rem 0.5rem 2rem}
.drawer-section{margin-bottom:0.5rem}
.drawer-cat-btn{width:100%;display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.75rem;background:transparent;border:none;color:var(--text-muted);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);cursor:pointer;border-radius:var(--radius-sm);transition:all 0.15s}
.drawer-cat-btn:hover{background:var(--bg-elevated);color:var(--text)}
.drawer-cat-btn .arrow{margin-left:auto;transition:transform 0.2s;font-size:0.625rem}
.drawer-cat-btn.open .arrow{transform:rotate(90deg)}
.drawer-items{display:none;flex-direction:column;gap:0.125rem;padding:0.25rem 0 0.5rem 0.5rem}
.drawer-items.open{display:flex}
.drawer-item{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;background:transparent;border:none;color:var(--text-muted);font-size:0.8125rem;font-weight:500;font-family:inherit;cursor:pointer;border-radius:var(--radius-sm);text-align:left;transition:all 0.15s;border:1px solid transparent}
.drawer-item:hover{background:var(--bg-elevated);color:var(--text)}
.drawer-item.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-border)}
.drawer-item .vip-tag{margin-left:auto;font-size:0.5625rem;font-weight:700;padding:0.0625rem 0.375rem;background:rgba(168,85,247,0.15);color:var(--purple);border-radius:3px;font-family:var(--font-mono)}
.drawer-item .lock-tag{margin-left:auto;font-size:0.5625rem;font-weight:700;padding:0.0625rem 0.375rem;background:rgba(239,68,68,0.15);color:var(--red);border-radius:3px;font-family:var(--font-mono)}
.drawer-footer{padding:0.75rem 1rem;border-top:1px solid var(--border);display:flex;gap:0.5rem;flex-shrink:0}
.drawer-footer .btn{flex:1;justify-content:center;font-size:0.75rem;padding:0.5rem}
.layout{padding:1.5rem 0 4rem}
.content-area{min-width:0}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1rem;border-radius:var(--radius-sm);font-size:0.8125rem;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-muted);transition:all 0.15s}
.btn:hover{color:var(--text);border-color:var(--border-hover)}
.btn-primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--bg);border-color:transparent;font-weight:700}
.btn-primary:hover{box-shadow:0 0 24px -8px rgba(234,179,8,0.5)}
.btn-sm{padding:0.375rem 0.625rem;font-size:0.6875rem}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--red)}
.ann-bar{display:none;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--radius-md);padding:0.75rem 1rem;margin-bottom:1.25rem;font-size:0.8125rem}
.ann-bar.show{display:block}
.ann-bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;gap:0.5rem}
.ann-bar-title{font-weight:700;color:var(--gold);font-size:0.8125rem}
.ann-bar-close{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;line-height:1;padding:0.125rem}
.ann-bar-close:hover{color:var(--red)}
.ann-bar-body{color:var(--text-muted);white-space:pre-wrap;font-size:0.75rem;line-height:1.5}
.page-header{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem}
.page-title-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;flex-wrap:wrap}
.page-title-row h1{font-size:1.375rem;font-weight:700;letter-spacing:-0.02em}
.badge{display:inline-block;padding:0.125rem 0.5rem;border-radius:4px;font-size:0.6875rem;font-weight:600;font-family:var(--font-mono)}
.badge.get{background:rgba(59,130,246,0.15);color:var(--blue)}
.badge.vip{background:rgba(168,85,247,0.15);color:var(--purple)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}
.badge.red{background:rgba(239,68,68,0.15);color:var(--red)}
.badge.green{background:rgba(34,197,94,0.15);color:var(--green)}
.page-desc{color:var(--text-muted);font-size:0.875rem;margin-bottom:1rem}
.url-box{display:flex;align-items:center;gap:0.5rem;background:var(--bg-code);border:1px solid var(--border);border-radius:var(--radius-md);padding:0.625rem 0.875rem;font-family:var(--font-mono);font-size:0.75rem;overflow-x:auto}
.url-box .base{color:var(--text-dim)}
.url-box .path{color:var(--gold)}
.copy-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:0.25rem 0.5rem;border-radius:var(--radius-sm);cursor:pointer;font-size:0.625rem;font-weight:600;font-family:inherit;flex-shrink:0;transition:all 0.15s}
.copy-btn:hover{color:var(--gold);border-color:var(--gold-dark)}
.tabs-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem}
.tabs-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg-elevated);overflow-x:auto}
.tab-btn{padding:0.75rem 1.25rem;background:transparent;border:none;color:var(--text-dim);font-size:0.8125rem;font-weight:600;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap}
.tab-btn:hover{color:var(--text-muted)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--bg-card)}
.tab-panel{padding:1.5rem;display:none}
.tab-panel.active{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field{display:flex;flex-direction:column;gap:0.375rem}
.field.full{grid-column:1/-1}
.field label{font-size:0.75rem;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:0.375rem}
.field label .req{color:var(--red)}
.field label .hint{color:var(--text-dim);font-family:var(--font-mono);font-size:0.6875rem;margin-left:auto;font-weight:400}
.field input,.field textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.625rem 0.875rem;color:var(--text);font-size:0.875rem;font-family:var(--font-mono);outline:none;width:100%;transition:border-color 0.15s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim);font-family:var(--font-sans)}
.form-actions{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.console-wrap{margin-top:1.25rem;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-code)}
.console-header{display:flex;align-items:center;justify-content:space-between;padding:0.625rem 1rem;background:var(--bg-elevated);border-bottom:1px solid var(--border);font-size:0.75rem;color:var(--text-dim);font-family:var(--font-mono)}
.console-status{display:flex;align-items:center;gap:0.5rem}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.idle{background:var(--text-dim)}
.status-dot.success{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-dot.error{background:var(--red);box-shadow:0 0 8px var(--red)}
.status-dot.loading{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.console-body{padding:1rem;font-family:var(--font-mono);font-size:0.75rem;line-height:1.7;color:var(--text-muted);max-height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.json-key{color:var(--gold-light)}.json-string{color:var(--green)}.json-number{color:var(--blue)}.json-boolean{color:var(--purple)}.json-null{color:var(--text-dim)}
.params-table{width:100%;border-collapse:separate;border-spacing:0;font-size:0.8125rem}
.params-table th{text-align:left;padding:0.75rem 1rem;font-size:0.6875rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid var(--border);font-family:var(--font-mono);background:var(--bg-elevated)}
.params-table td{padding:0.875rem 1rem;border-bottom:1px solid var(--border);vertical-align:top}
.params-table tbody tr:last-child td{border-bottom:none}
.param-name{font-family:var(--font-mono);font-weight:600;color:var(--gold-light);font-size:0.8125rem}
.param-type{font-family:var(--font-mono);font-size:0.75rem;color:var(--blue)}
.param-req{font-size:0.625rem;font-weight:700;color:var(--red);text-transform:uppercase;margin-left:0.375rem}
.param-desc{color:var(--text-muted);font-size:0.8125rem}
.vip-gate,.key-gate{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center}
.vip-gate h2,.key-gate h2{font-size:1.25rem;margin-bottom:0.5rem}
.vip-gate p,.key-gate p{color:var(--text-muted);font-size:0.875rem;margin-bottom:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
.key-input-row{display:flex;gap:0.5rem;max-width:420px;margin:0 auto}
.key-input-row input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.625rem 0.875rem;color:var(--text);font-size:0.875rem;font-family:var(--font-mono);outline:none}
.key-input-row input:focus{border-color:var(--gold)}
.profile-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;text-align:center;margin-bottom:1.25rem}
.profile-avatar-wrap{position:relative;width:100px;height:100px;margin:0 auto 1rem}
.profile-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--bg-elevated)}
.profile-name{font-size:1.5rem;font-weight:800;margin-bottom:0.25rem}
.profile-email{color:var(--text-muted);font-size:0.8125rem;font-family:var(--font-mono);margin-bottom:1rem}
.profile-badges{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.profile-stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem}
.profile-stat-value{font-size:1.5rem;font-weight:800;color:var(--gold);font-family:var(--font-mono)}
.profile-stat-label{font-size:0.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);margin-top:0.25rem}
.search-results{position:absolute;top:100%;left:1rem;right:1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);margin-top:0.25rem;max-height:300px;overflow-y:auto;z-index:10;box-shadow:0 10px 30px -10px rgba(0,0,0,0.5)}
.search-result{padding:0.625rem 0.875rem;cursor:pointer;font-size:0.8125rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:0.5rem}
.search-result:last-child{border-bottom:none}
.search-result:hover{background:var(--bg-elevated)}
.search-result .cat{font-size:0.625rem;color:var(--text-dim);font-family:var(--font-mono)}
.search-empty{padding:1rem;text-align:center;color:var(--text-dim);font-size:0.75rem;font-family:var(--font-mono)}
.toast-container{position:fixed;bottom:2rem;right:2rem;z-index:1000;display:flex;flex-direction:column;gap:0.5rem}
.toast{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:0.75rem 1rem;font-size:0.8125rem;box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);min-width:240px;font-family:var(--font-mono);animation:slideIn 0.3s ease-out}
.toast.success{border-color:rgba(34,197,94,0.3);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.container{padding:0 1rem}.navbar .container{gap:0.5rem}.avatar-name{display:none}.avatar-btn{padding:0.25rem}.form-grid{grid-template-columns:1fr}.page-header{padding:1.25rem}.page-title-row h1{font-size:1.125rem}.tab-panel{padding:1rem}.drawer{width:280px}.profile-stats{grid-template-columns:1fr}.key-input-row{flex-direction:column}}
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="drawer-title">𝐍𝐄𝐗𝐔𝐒 <span>𝐌𝐄𝐍𝐔</span></div>
        <button class="drawer-close" onclick="toggleDrawer()">✕</button>
    </div>
    <div class="drawer-search">
        <input type="text" id="menuSearch" placeholder="Sorgu ara...">
        <div class="search-results" id="searchResults" style="display:none"></div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
        <button class="btn" onclick="navigateTo('profile')">Profil</button>
        <button class="btn" onclick="logoutUser()">Çıkış</button>
    </div>
</aside>

<nav class="navbar">
    <div class="container">
        <div class="nav-left">
            <button class="hamburger" onclick="toggleDrawer()" aria-label="Menü"><span></span><span></span><span></span></button>
            <a href="index.html" class="logo">𝐍𝐄𝐗𝐔𝐒 <span>SORGU</span></a>
        </div>
        <div class="nav-actions">
            <a href="#profile" class="avatar-btn" onclick="event.preventDefault();navigateTo('profile')">
                <img class="avatar-mini" id="navAvatar" src="https://i.hizliresim.com/midnihxu.jpg" onerror="this.src='https://i.hizliresim.com/midnihxu.jpg'">
                <span class="avatar-name" id="navName">misafir</span>
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="layout">
        <main class="content-area" id="contentArea"></main>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// DEĞİŞTİRİLECEK YER: Render'dan aldığın canlı backend adresi
const API_URL = 'https://nexuspanel-t583.onrender.com/api';

const CATALOG = {
    kimlik: { title: "Kimlik & Kişi", items: [
        { id:'tc', name:'TC Sorgulama', params:[{n:'tc',req:1,ph:'17420629810'}], desc:'TC ile kişi bilgilerini sorgular.' },
        { id:'tcpro', name:'TC Pro Sorgulama', params:[{n:'tc',req:1,ph:'17420629810'}], desc:'TC ile detaylı kişi bilgisi sorgular.' },
        { id:'adsoyad', name:'Ad Soyad Sorgulama', params:[{n:'ad',req:1,ph:'ROKET'},{n:'soyad',req:1,ph:'ATAR'}], desc:'Ad ve soyad ile kişi sorgular.' },
        { id:'aile', name:'Aile Sorgulama', params:[{n:'tc',req:1,ph:'17420629810'}], desc:'TC ile aile bilgilerini sorgular.' },
        { id:'sulale', name:'Sülale Sorgulama', params:[{n:'tc',req:1,ph:'17420629810'}], desc:'TC ile sülale bilgilerini sorgular.' },
        { id:'tcgsm', name:'TC → GSM', params:[{n:'tc',req:1,ph:'11111111110'}], desc:'TC ile telefona ulaşır.' },
        { id:'gsmtc', name:'GSM → TC', params:[{n:'gsm',req:1,ph:'5550000000'}], desc:'GSM ile TC\'ye ulaşır.' }
    ]},
    egitim: { title: "Eğitim", items: [
        { id:'eokul', name:'E-Okul Sorgulama', params:[{n:'tc',req:1,ph:'13334777982'}], desc:'TC ile e-okul bilgilerini sorgular.' }
    ]},
    tapu: { title: "Tapu & Adres", items: [
        { id:'adres', name:'Adres Sorgulama', params:[{n:'tc',req:1,ph:'11111111110'}], desc:'TC ile adres bilgilerini sorgular.' },
        { id:'tapu', name:'Tapu Sorgulama', params:[{n:'tc',req:1,ph:'27727166918'}], desc:'TC ile tapu kayıtlarını sorgular.' },
        { id:'adaparsel', name:'Ada Parsel Sorgulama', params:[{n:'il',req:1,ph:'İSTANBUL'},{n:'ilce',req:1,ph:'KADIKÖY'}], desc:'İl/ilçe ile ada parsel sorgular.' }
    ]}
};

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function highlightJson(s){
    return escapeHtml(s).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
        let c = 'json-number';
        if(/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-string';
        else if(/true|false/.test(m)) c = 'json-boolean';
        else if(/null/.test(m)) c = 'json-null';
        return `<span class="${c}">${m}</span>`;
    });
}
function showToast(msg, type='success'){
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
async function copyToClipboard(text){
    try{ await navigator.clipboard.writeText(text); showToast('Panoya kopyalandı'); }
    catch{ showToast('Kopyalama başarısız', 'error'); }
}

// Auth Kontrolü
const token = localStorage.getItem('nexus_token');
const username = localStorage.getItem('nexus_username');
if(!token) window.location.href = 'login.html';

function updateNavAvatar(){
    const img = document.getElementById('navAvatar');
    const nm = document.getElementById('navName');
    if(img) img.src = 'https://i.hizliresim.com/midnihxu.jpg';
    if(nm) nm.textContent = username || 'misafir';
}

function logoutUser(){
    if(!confirm('Çıkış yapılsın mı?')) return;
    localStorage.removeItem('nexus_token');
    localStorage.removeItem('nexus_role');
    localStorage.removeItem('nexus_username');

}

let drawerOpen = false;
function toggleDrawer(){
    drawerOpen = !drawerOpen;
    document.getElementById('drawer').classList.toggle('open', drawerOpen);
    document.getElementById('drawerOverlay').classList.toggle('open', drawerOpen);
}

function renderDrawerMenu(){
    const body = document.getElementById('drawerBody');
    body.innerHTML = Object.entries(CATALOG).map(([catKey, cat]) => {
        const itemsHtml = cat.items.map(item => {
            return `<button class="drawer-item" data-id="${item.id}">${item.name}</button>`;
        }).join('');
        return `<div class="drawer-section">
            <button class="drawer-cat-btn" data-cat="${catKey}"><span>${cat.title}</span><span class="arrow">▶</span></button>
            <div class="drawer-items" id="items-${catKey}">${itemsHtml}</div>
        </div>`;
    }).join('');
    body.querySelectorAll('.drawer-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const catKey = btn.dataset.cat;
            const items = document.getElementById(`items-${catKey}`);
            const isOpen = items.classList.contains('open');
            items.classList.toggle('open', !isOpen);
            btn.classList.toggle('open', !isOpen);
        });
    });
    body.querySelectorAll('.drawer-item').forEach(item => {
        item.addEventListener('click', () => {
            body.querySelectorAll('.drawer-item').forEach(x => x.classList.remove('active'));
            item.classList.add('active');
            navigateTo(item.dataset.id);
            toggleDrawer();
        });
    });
}

function setupMenuSearch(){
    const input = document.getElementById('menuSearch');
    const results = document.getElementById('searchResults');
    if(!input || !results) return;
    input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if(!q){ results.style.display = 'none'; results.innerHTML = ''; return; }
        const all = [];
        for(const cat of Object.values(CATALOG)){
            cat.items.forEach(item => {
                if(item.name.toLowerCase().includes(q) || item.id.includes(q)){
                    all.push({ ...item, catTitle: cat.title });
                }
            });
        }
        if(!all.length){ results.innerHTML = '<div class="search-empty">// sonuç yok</div>'; }
        else {
            results.innerHTML = all.slice(0, 10).map(item => `
                <div class="search-result" data-id="${item.id}">
                    <span>${escapeHtml(item.name)}</span>
                    <span class="cat">${escapeHtml(item.catTitle)}</span>
                </div>
            `).join('');
            results.querySelectorAll('.search-result').forEach(r => {
                r.addEventListener('click', () => {
                    navigateTo(r.dataset.id);
                    input.value = '';
                    results.style.display = 'none';
                    toggleDrawer();
                });
            });
        }
        results.style.display = 'block';
    });
}

let currentPage = 'tc';
let currentTab = 'test';
function navigateTo(pageId){
    if(pageId === 'profile'){ renderProfilePage(); return; }
    currentPage = pageId;
    currentTab = 'test';
    if(window.location.hash !== '#' + pageId) window.location.hash = pageId;
    renderContent();
}
function findItemById(id){
    for(const cat of Object.values(CATALOG)){
        const found = cat.items.find(i => i.id === id);
        if(found) return found;
    }
    return null;
}

function renderContent(){
    const content = document.getElementById('contentArea');
    const item = findItemById(currentPage);
    if(!item){ content.innerHTML = '<div class="key-gate"><h2>Sayfa bulunamadı</h2></div>'; return; }
    
    const url = `Sadece Backend'e istek atılır`;
    content.innerHTML = `
        <div class="page-header">
            <div class="page-title-row">
                <h1>${escapeHtml(item.name)}</h1>
                <span class="badge get">GET</span>
                <span class="badge green">GÜVENLİ BAĞLANTI</span>
            </div>
            <p class="page-desc">${escapeHtml(item.desc)}</p>
            <div class="url-box">
                <span class="base">/api/query/${item.id}</span>
                <span class="path">?${item.params.map(p=>`${p.n}={${p.n}}`).join('&')}</span>
            </div>
        </div>
        <div class="tabs-section">
            <div class="tabs-bar">
                <button class="tab-btn ${currentTab==='test'?'active':''}" data-tab="test">Canlı Test</button>
                <button class="tab-btn ${currentTab==='params'?'active':''}" data-tab="params">Parametreler</button>
            </div>
            <div class="tab-panel ${currentTab==='test'?'active':''}" id="panel-test">${renderTestPanel(item)}</div>
            <div class="tab-panel ${currentTab==='params'?'active':''}" id="panel-params">${renderParamsPanel(item)}</div>
        </div>
    `;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentTab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
            ['test','params'].forEach(t => document.getElementById(`panel-${t}`).classList.toggle('active', t === currentTab));
        });
    });
}

function renderTestPanel(item){
    const fields = item.params.map(p => `
        <div class="field">
            <label>${p.n} ${p.req ? '<span class="req">*</span>' : ''}<span class="hint">string</span></label>
            <input type="text" id="param-${p.n}" placeholder="${escapeHtml(p.ph||'')}">
        </div>
    `).join('');
    return `
        <form onsubmit="executeTest(event)">
            <div class="form-grid">${fields || '<div class="field full" style="color:var(--text-dim)">// parametre gerekmez</div>'}</div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="resetForm()">Sıfırla</button>
                <button type="submit" class="btn btn-primary">İsteği Gönder</button>
            </div>
        </form>
        <div class="console-wrap">
            <div class="console-header">
                <div class="console-status"><span class="status-dot idle" id="statusDot"></span><span id="statusText">Hazır</span></div>
                <span id="responseTime"></span>
            </div>
            <div class="console-body" id="consoleBody"><span style="color:var(--text-dim)">// API cevabı burada görünecek...</span></div>
        </div>
    `;
}

function renderParamsPanel(item){
    if(!item.params.length) return '<div style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.8125rem">// parametre gerekmez</div>';
    return `<table class="params-table">
        <thead><tr><th>Parametre</th><th>Tip</th><th>Açıklama</th></tr></thead>
        <tbody>${item.params.map(p => `<tr>
            <td><span class="param-name">${p.n}</span>${p.req ? '<span class="param-req">Gerekli</span>' : ''}</td>
            <td><span class="param-type">string</span></td>
            <td class="param-desc">${p.ph ? 'Örnek: ' + escapeHtml(p.ph) : '—'}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

function resetForm(){
    const item = findItemById(currentPage);
    if(!item) return;
    item.params.forEach(p => {
        const el = document.getElementById(`param-${p.n}`);
        if(el) el.value = '';
    });
}

async function executeTest(e){
    e.preventDefault();
    const item = findItemById(currentPage);
    if(!item) return;
    
    const values = {};
    item.params.forEach(p => {
        const el = document.getElementById(`param-${p.n}`);
        if(el) values[p.n] = el.value.trim();
    });
    for(const p of item.params){
        if(p.req && !values[p.n]){ showToast(`${p.n} alanı zorunlu`, 'error'); return; }
    }
    
    const dot = document.getElementById('statusDot');
    const st = document.getElementById('statusText');
    const cb = document.getElementById('consoleBody');
    const rt = document.getElementById('responseTime');
    if(!dot || !st || !cb || !rt) return;
    
    dot.className = 'status-dot loading';
    st.textContent = 'İstek gönderiliyor...';
    cb.innerHTML = '<span style="color:var(--gold)">// Yükleniyor...</span>';
    rt.textContent = '';
    
    const t0 = performance.now();
    const qs = new URLSearchParams(values).toString();
    
    try{
        const res = await fetch(`${API_URL}/query/${item.id}?${qs}`, {
            headers: { 
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/json' 
            }
        });
        
        const elapsed = (performance.now() - t0).toFixed(1);
        const text = await res.text();
        let out;
        try{ out = highlightJson(JSON.stringify(JSON.parse(text), null, 2)); }
        catch{ out = escapeHtml(text); }
        
        if(res.ok){ 
            dot.className = 'status-dot success'; 
            st.textContent = `Başarılı — HTTP ${res.status}`; 
        }
        else{ 
            dot.className = 'status-dot error'; 
            st.textContent = `Hata — HTTP ${res.status}`; 
        }
        rt.textContent = `${elapsed}ms`;
        cb.innerHTML = out;
    }catch(err){
        const elapsed = (performance.now() - t0).toFixed(1);
        dot.className = 'status-dot error';
        st.textContent = 'Bağlantı Hatası';
        rt.textContent = `${elapsed}ms`;
        cb.innerHTML = `<span style="color:var(--red)">// Hata: ${escapeHtml(err.message)}</span>`;
    }
}

function renderProfilePage(){
    const content = document.getElementById('contentArea');
    content.innerHTML = `
        <div class="profile-card">
            <div class="profile-avatar-wrap">
                <img class="profile-avatar" src="https://i.hizliresim.com/midnihxu.jpg" alt="avatar">
            </div>
            <div class="profile-name">${escapeHtml(username || 'Misafir')}</div>
            <div class="profile-email">// Güvenli JWT Oturumu</div>
            <div class="profile-badges">
                <span class="badge green">Sistem Aktif</span>
            </div>
            <button class="btn" onclick="logoutUser()" style="margin-left:0.5rem">Çıkış Yap</button>
        </div>
    `;
}

function handleHash(){
    const hash = window.location.hash.replace('#','');
    if(hash === 'profile'){ renderProfilePage(); return; }
    if(hash && findItemById(hash)){ currentPage = hash; renderContent(); return; }
    if(!hash){ currentPage = 'tc'; renderContent(); }
}
window.addEventListener('hashchange', handleHash);

(function init(){
    updateNavAvatar();
    renderDrawerMenu();
    setupMenuSearch();
    handleHash();
})();
</script>
