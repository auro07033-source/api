<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Bayi Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#EAB308;--gold-light:#FDE047;--gold-dim:rgba(234,179,8,0.08);--gold-border:rgba(234,179,8,0.2);--bg:#09090B;--bg-card:#111114;--bg-elevated:#18181C;--bg-input:#1C1C21;--border:#27272A;--border-hover:#3F3F46;--text:#FAFAFA;--text-muted:#A1A1AA;--text-dim:#71717A;--green:#22C55E;--red:#EF4444;--blue:#3B82F6;--purple:#A855F7;--orange:#F97316;--font-sans:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;--radius-sm:6px;--radius-md:10px;--radius-lg:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.container{max-width:1200px;margin:0 auto;padding:0 2rem;width:100%}
.navbar{position:sticky;top:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 0}
.navbar .container{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.logo{font-size:1.125rem;font-weight:800;letter-spacing:-0.03em;text-decoration:none;color:var(--text)}
.logo span{color:var(--gold)}
.nav-right{display:flex;gap:0.5rem;align-items:center}
.user-badge{padding:0.375rem 0.75rem;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:var(--radius-md);font-size:0.75rem;font-family:var(--font-mono);color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1rem;border-radius:var(--radius-sm);font-size:0.8125rem;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-muted);transition:all 0.15s}
.btn:hover{color:var(--text);border-color:var(--border-hover)}
.btn-primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:var(--bg);border-color:transparent;font-weight:700}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--red)}
.btn-sm{padding:0.375rem 0.625rem;font-size:0.6875rem}
.layout{padding:2rem 0 4rem}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1.5rem}
.card-title{font-size:1.125rem;font-weight:700;margin-bottom:0.5rem}
.card-desc{color:var(--text-muted);font-size:0.8125rem;margin-bottom:1.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field{display:flex;flex-direction:column;gap:0.375rem}
.field.full{grid-column:1/-1}
.field label{font-size:0.75rem;font-weight:600;color:var(--text-muted);font-family:var(--font-mono)}
.field input,.field textarea,.field select{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.625rem 0.875rem;color:var(--text);font-size:0.8125rem;font-family:var(--font-mono);outline:none;width:100%;transition:border-color 0.15s}
.field input:focus,.field select:focus{border-color:var(--gold)}
.form-actions{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1.25rem;flex-wrap:wrap}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);margin-top:1rem}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:0.8125rem}
th{text-align:left;padding:0.75rem 1rem;font-size:0.6875rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg-elevated);border-bottom:1px solid var(--border);font-family:var(--font-mono);white-space:nowrap}
td{padding:0.75rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:0.125rem 0.5rem;border-radius:4px;font-size:0.6875rem;font-weight:600;font-family:var(--font-mono)}
.badge.green{background:rgba(34,197,94,0.15);color:var(--green)}
.badge.red{background:rgba(239,68,68,0.15);color:var(--red)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}
.badge.blue{background:rgba(59,130,246,0.15);color:var(--blue)}
.badge.purple{background:rgba(168,85,247,0.15);color:var(--purple)}
.mono{font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text-dim);font-family:var(--font-mono);font-size:0.8125rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.25rem}
.stat-label{font-size:0.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);margin-bottom:0.5rem}
.stat-value{font-size:1.75rem;font-weight:800;color:var(--gold);font-family:var(--font-mono)}
.toast-container{position:fixed;bottom:2rem;right:2rem;z-index:1000;display:flex;flex-direction:column;gap:0.5rem}
.toast{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:0.75rem 1rem;font-size:0.8125rem;box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);min-width:240px;font-family:var(--font-mono);animation:slideIn 0.3s ease-out}
.toast.success{border-color:rgba(34,197,94,0.3);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.container{padding:0 1rem}}
</style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="reseller.html" class="logo">𝐍𝐄𝐗𝐔𝐒 <span>𝐁𝐀𝐘𝐈</span></a>
        <div class="nav-right">
            <span class="user-badge" id="rsBadge">bayi</span>
            <button class="btn btn-sm btn-danger" onclick="doLogout()">Çıkış</button>
        </div>
    </div>
</nav>
<div class="container">
    <div class="layout">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Bakiye</div><div class="stat-value" id="stBalance">0 ₺</div></div>
            <div class="stat-card"><div class="stat-label">Toplam Key</div><div class="stat-value" id="stKeys">0</div></div>
            <div class="stat-card"><div class="stat-label">Aktif Key</div><div class="stat-value" id="stActiveKeys" style="color:var(--green)">0</div></div>
        </div>

        <div class="card">
            <div class="card-title">Key Oluştur</div>
            <div class="card-desc">Key başına ücret bakiyenden düşülür (1 Gün: 10₺, 7 Gün: 50₺, 30 Gün: 150₺, 90 Gün: 350₺, 365 Gün: 1000₺).</div>
            <form id="keyForm">
                <div class="form-grid">
                    <div class="field"><label>Key Kodu (boş = otomatik)</label><input type="text" id="keyCode" placeholder="BAYI-XXXX-XXXX"></div>
                    <div class="field"><label>Süre</label><select id="keyDuration"><option value="1">1 Gün - 10₺</option><option value="7">7 Gün - 50₺</option><option value="30" selected>30 Gün - 150₺</option><option value="90">90 Gün - 350₺</option><option value="365">1 Yıl - 1000₺</option></select></div>
                    <div class="field"><label>Tür</label><select id="keyType"><option value="standart">Standart</option><option value="vip">VIP</option><option value="premium">Premium</option></select></div>
                    <div class="field"><label>Kullanım Limiti (0=sınırsız)</label><input type="number" id="keyLimit" value="0" min="0"></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-primary">KEY OLUŞTUR</button></div>
            </form>
        </div>

        <div class="card">
            <div class="card-title">Key'lerim</div>
            <div class="table-wrap" id="keysWrap"><div class="empty">Henüz key yok</div></div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script>
const API_URL = 'https://nexuspanel-t583.onrender.com/api';
const token = localStorage.getItem('nexus_token');
const role = localStorage.getItem('nexus_role');
if(!token || role !== 'reseller'){ window.location.href = 'login.html'; }

const KEY_PRICES = { 1:10, 7:50, 30:150, 90:350, 365:1000 };

function fmtDate(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg, type='success'){
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(()=>t.remove(), 3000);
}
async function api(path, opts={}) {
    const res = await fetch(`${API_URL}${path}`, {
        ...opts,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            ...(opts.headers || {})
        }
    });
    if(!res.ok) {
        const err = await res.json().catch(()=>({error:'Bilinmeyen hata'}));
        throw new Error(err.error || 'İstek başarısız');
    }
    return res.json();
}

async function loadMe(){
    try {
        const me = await api('/me');
        document.getElementById('rsBadge').textContent = me.username;
        document.getElementById('stBalance').textContent = (me.balance||0).toFixed(2) + ' ₺';
    } catch(e) { toast(e.message, 'error'); }
}

async function loadKeys(){
    try {
        const keys = await api('/reseller/keys');
        document.getElementById('stKeys').textContent = keys.length;
        document.getElementById('stActiveKeys').textContent = keys.filter(k=>k.active).length;
        const wrap = document.getElementById('keysWrap');
        if(!keys.length){ wrap.innerHTML = '<div class="empty">Henüz key yok</div>'; return; }
        wrap.innerHTML = `<table><thead><tr><th>Key</th><th>Tür</th><th>Süre</th><th>Limit</th><th>Kullanım</th><th>Kullanan</th><th>Durum</th></tr></thead><tbody>${keys.map(k=>`<tr>
            <td class="mono">${escapeHtml(k.code)}</td>
            <td><span class="badge ${k.type==='vip'?'purple':k.type==='premium'?'gold':'blue'}">${k.type}</span></td>
            <td class="mono">${k.duration_days==0?'Süresiz':k.duration_days+' gün'}</td>
            <td class="mono">${k.limit_count==0?'∞':k.limit_count}</td>
            <td class="mono">${k.used_count||0}</td>
            <td class="mono">${k.assigned_username||'—'}</td>
            <td>${k.active?'<span class="badge green">Aktif</span>':'<span class="badge red">İptal</span>'}</td>
        </tr>`).join('')}</tbody></table>`;
    } catch(e) { toast(e.message, 'error'); }
}

document.getElementById('keyForm').addEventListener('submit', async e=>{
    e.preventDefault();
    let code = document.getElementById('keyCode').value.trim();
    const duration = parseInt(document.getElementById('keyDuration').value);
    const price = KEY_PRICES[duration] || 0;
    if(!code){ const rand = () => Math.random().toString(36).slice(2,6).toUpperCase(); code = `BAYI-${rand()}-${rand()}`; }
    try {
        await api('/reseller/key_create', { method: 'POST', body: JSON.stringify({
            code,
            type: document.getElementById('keyType').value,
            duration_days: duration,
            limit_count: parseInt(document.getElementById('keyLimit').value) || 0,
            price
        })});
        document.getElementById('keyForm').reset();
        toast(`Key oluşturuldu, ${price}₺ düşüldü`);
        loadKeys(); loadMe();
    } catch(e) { toast(e.message, 'error'); }
});

function doLogout(){
    localStorage.removeItem('nexus_token');
    localStorage.removeItem('nexus_role');
    localStorage.removeItem('nexus_username');
    window.location.href = 'login.html';
}

loadMe(); loadKeys();
</script>
</body>
</html>
